services:
  # FastAPI Backend Service (Free Plan)
  - type: web
    name: real-estate-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

  # Streamlit Frontend Service (Free Plan)
  - type: web
    name: real-estate-frontend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run Home.py --server.port $PORT --server.address 0.0.0.0 --server.enableCORS=false --server.enableXsrfProtection=false
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: API_URL
        fromService:
          type: web
          name: real-estate-backend
          property: host
